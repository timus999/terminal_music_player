[package]
name = "music_player"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49" , features = ["rt-multi-thread", "macros", "sync", "time"]}
ratatui = "0.30"
crossterm = "0.29.0"
rodio = "0.22.2"
reqwest = { version = "0.13.2", features = ["blocking", "json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rustypipe = "0.11.4"
dirs = "6.0.0"
symphonia = {version = "0.5.5", features = ["mp3", "flac", "ogg", "wav", "aac"] }
id3 = "1.16.4"
ratatui-image = {version = "10.0.6" , default-features = false, features = ["image-defaults", "crossterm"] }
image = "0.25.10"

