[package]
name = "music_player"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.49" , features = ["rt-multi-thread", "macros", "sync", "time"]}
ratatui = "0.30"
crossterm = "0.29.0"
rodio = "0.22.2"
reqwest = { version = "0.13.2", features = ["blocking", "json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

